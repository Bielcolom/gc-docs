<section class="section">
  <span class="form-label">Color</span>
  <app-color-swatches
    label="Color del trazo"
    [colors]="palette"
    [value]="target.color()"
    (valueChange)="target.setColor($event)"
  />
</section>
<section class="section">
  <label class="form-label" for="stroke-width"
    >Grosor <output>{{ target.strokeWidth() }} pt</output></label
  >
  <input
    id="stroke-width"
    class="form-range"
    type="range"
    min="0.5"
    max="20"
    step="0.5"
    [value]="target.strokeWidth()"
    (input)="onWidth($event)"
  />
</section>
