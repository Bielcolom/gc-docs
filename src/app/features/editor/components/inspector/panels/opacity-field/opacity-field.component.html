<section class="section">
  <label class="form-label" for="opacity"
    >Opacidad <output>{{ target.opacity() * 100 | number: '1.0-0' }} %</output></label
  >
  <input
    id="opacity"
    class="form-range"
    type="range"
    min="0.05"
    max="1"
    step="0.05"
    [value]="target.opacity()"
    (input)="onInput($event)"
  />
</section>
