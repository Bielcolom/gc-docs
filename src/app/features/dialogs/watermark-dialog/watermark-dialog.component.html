<app-dialog-shell title="Marca de agua">
  <form [formGroup]="form" class="settings">
    <label class="switch">
      <input type="checkbox" formControlName="enabled" />
      <span class="switch__track"></span>
      Mostrar la marca de agua en todas las páginas
    </label>

    <fieldset class="settings__fields" [disabled]="!form.controls.enabled.value">
      <div>
        <label class="form-label" for="wm-text">Texto</label>
        <input id="wm-text" class="form-input" type="text" formControlName="text" />
      </div>
      <div class="settings__row">
        <div>
          <label class="form-label" for="wm-size"
            >Tamaño <output>{{ form.controls.size.value }} pt</output></label
          >
          <input
            id="wm-size"
            class="form-range"
            type="range"
            min="16"
            max="160"
            formControlName="size"
          />
        </div>
        <div>
          <label class="form-label" for="wm-angle"
            >Inclinación <output>{{ form.controls.angle.value }}°</output></label
          >
          <input
            id="wm-angle"
            class="form-range"
            type="range"
            min="-90"
            max="90"
            step="5"
            formControlName="angle"
          />
        </div>
      </div>
      <div>
        <label class="form-label" for="wm-opacity"
          >Opacidad
          <output>{{ form.controls.opacity.value * 100 | number: '1.0-0' }} %</output></label
        >
        <input
          id="wm-opacity"
          class="form-range"
          type="range"
          min="0.05"
          max="0.8"
          step="0.01"
          formControlName="opacity"
        />
      </div>
      <div>
        <span class="form-label">Color</span>
        <app-color-swatches
          label="Color de la marca de agua"
          [colors]="colors"
          [value]="form.controls.color.value"
          (valueChange)="form.controls.color.setValue($event ?? colors[0])"
        />
      </div>
    </fieldset>
    <p class="form-hint">Los cambios se ven al momento en el documento.</p>
  </form>
  <ng-container dialogFooter>
    <button type="button" class="btn btn--primary" (click)="dialogRef.close()">Hecho</button>
  </ng-container>
</app-dialog-shell>
