<app-dialog-shell title="PDF protegido">
  <form id="password-form" [formGroup]="form" (ngSubmit)="submit()">
    <p class="text-body">
      «{{ data.fileName }}» está protegido. Escribe la contraseña para abrirlo.
    </p>
    <label class="form-label" for="password">Contraseña</label>
    <input
      id="password"
      class="form-input"
      type="password"
      autocomplete="off"
      formControlName="password"
      appAutofocus
    />
    @if (data.incorrect) {
      <p class="form-error" role="alert">La contraseña no es correcta. Prueba otra vez.</p>
    }
    <p class="form-hint">
      El PDF se descifra en tu navegador. Al descargarlo, sus páginas se guardan como imagen sin
      contraseña.
    </p>
  </form>
  <ng-container dialogFooter>
    <button type="button" class="btn" (click)="cancel()">Cancelar</button>
    <button type="submit" form="password-form" class="btn btn--primary" [disabled]="form.invalid">
      Abrir
    </button>
  </ng-container>
</app-dialog-shell>
